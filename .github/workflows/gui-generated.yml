name: "GUI 生成与产物测试"

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "构建模式"
        required: true
        type: choice
        default: "Release"
        options:
          - "Debug"
          - "Release"
      publish:
        description: "是否发布"
        required: false
        type: boolean
        default: false

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    name: "生成并检查产物"
    runs-on: "ubuntu-latest"
    timeout-minutes: 15
    env:
      BUILD_MODE: "GUI"
      RETRY_COUNT: "2"
    steps:
      - name: "检出仓库"
        uses: actions/checkout@v7
      - name: "运行命令"
        shell: bash
        run: |
          printf 'generated by GUI\n' > gui-output.txt
      - name: "上传构建产物"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: "GUI 生成结果"
          path: "gui-output.txt"
          retention-days: 1
