name: GitTools Actions Test

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Test mode
        required: true
        default: success
        type: choice
        options:
          - success
          - failure
          - long
      message:
        description: Message stored in the artifact
        required: true
        default: GitTools Actions test
        type: string
      use_secret:
        description: Verify that the test secret exists
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore test cache
        uses: actions/cache@v4
        with:
          path: .actions-cache
          key: gittools-actions-${{ github.run_id }}
          restore-keys: |
            gittools-actions-

      - name: Prepare output
        shell: bash
        env:
          TEST_MODE: ${{ inputs.mode || 'success' }}
          TEST_MESSAGE: ${{ inputs.message || 'push event' }}
          TEST_VARIABLE: ${{ vars.GITTOOLS_TEST_VARIABLE }}
          TEST_SECRET: ${{ secrets.GITTOOLS_TEST_SECRET }}
          USE_SECRET: ${{ inputs.use_secret || 'true' }}
        run: |
          set -euo pipefail
          mkdir -p out .actions-cache
          printf 'mode=%s\nmessage=%s\nvariable=%s\n' "$TEST_MODE" "$TEST_MESSAGE" "$TEST_VARIABLE" > out/result.txt
          printf 'cache generated by run %s\n' "$GITHUB_RUN_ID" > .actions-cache/cache.txt
          if [[ "$USE_SECRET" == "true" && -z "$TEST_SECRET" ]]; then
            echo 'Required test secret is missing.' >&2
            exit 2
          fi

      - name: Long-running cancellable step
        if: ${{ inputs.mode == 'long' }}
        shell: bash
        run: |
          for index in $(seq 1 60); do
            echo "waiting $index/60"
            sleep 5
          done

      - name: Intentional failure
        if: ${{ inputs.mode == 'failure' }}
        shell: bash
        run: |
          echo 'Intentional failure requested for GitTools testing.' >&2
          exit 1

      - name: Upload build artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: gittools-actions-result-${{ github.run_id }}
          path: out/result.txt
          if-no-files-found: error
          retention-days: 1

  inspect:
    name: Inspect result
    runs-on: ubuntu-latest
    needs: build
    if: ${{ always() }}
    steps:
      - name: Report upstream result
        shell: bash
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: echo "build_result=$BUILD_RESULT"
